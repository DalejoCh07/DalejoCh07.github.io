
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniel - Objetos 3D</title>

    <link rel="stylesheet" href="style.css">

    <!-- Importar Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

</head>

<body>

    <!-- ENCABEZADO -->
    <header class="header">

        <div class="logo">
            <div class="cubo">◆</div>
            <h1>Actividad de Objetos 3D</h1>
        </div>

        <!-- MENÚ -->
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="daniel.html" class="activo">Daniel</a>
            <a href="marcos.html">Marcos</a>
            <a href="acercaDe.html">Integrantes</a>
        </nav>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido">

        

        <p class="subtitulo">
            Modelos tridimensionales aplicados por Daniel.
        </p>


        <!-- GALERÍA DE MODELOS -->
        <section class="galeria">


            <!-- MODELO 3D 1 -->
            <div class="objeto-card">

                <div class="numero">01</div>

                <h3>Modelo 1</h3>

                <div class="modelo-container">

                    <model-viewer
                        src="maxwell/scene.gltf"
                        alt="Primer objeto 3D de Daniel"
                        camera-controls
                        auto-rotate
                        shadow-intensity="1"
                        exposure="1"
                        environment-image="neutral">
                    </model-viewer>
                    
                </div>

                <p>
                    Modelo del reconocido meme del gato Maxwell.
                </p>

            </div>


            <!-- MODELO 3D 2 -->
            <div class="objeto-card">

                <div class="numero">02</div>

                <h3>Modelo 2</h3>

                <div class="modelo-container">

                    <model-viewer
                        src="mango/scene.gltf"
                        alt="Segundo objeto 3D de Daniel"
                        camera-controls
                        auto-rotate
                        shadow-intensity="1"
                        exposure="1"
                        environment-image="neutral">
                    </model-viewer>

                </div>

                <p>
                    Modelo de un jugoso y nutritivo mango.
                </p>

            </div>


        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Diseño de Experiencia de Usuario - TI - PAO 4</p>
    </footer>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</body>

</html>
